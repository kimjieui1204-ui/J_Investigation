name: SEC 펀더멘털 수집

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 2 * *'

# 워크플로우에 저장소 쓰기 권한 부여
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: SEC 데이터 수집 실행
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          python sec_fundamentals.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json
          git diff --staged --quiet || git commit -m "Update fundamentals.json [skip ci]"
          git push
